syntax = "proto3";

package tieba.im;

option java_package = "com.huanchengfly.tieba.post.api.models.protos.im";

import "Error.proto";

// cmd 205001：发送私信
message CommitPersonalMsgReqIdl {
  message DataReq {
    int64 groupId = 1;
    int64 toUid = 2;
    int32 msgType = 3;
    string content = 4;
    int64 recordId = 6;
  }
  DataReq data = 1;
}

message CommitPersonalMsgResIdl {
  message BlockInfo {
    int32 blockErrno = 1;
    string blockErrmsg = 2;
  }
  message DataRes {
    int64 msgId = 1;
    BlockInfo blockInfo = 6;
  }
  tieba.Error error = 1;
  DataRes data = 2;
}
