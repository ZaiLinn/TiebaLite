syntax = "proto3";

package tieba;

option java_package = "com.huanchengfly.tieba.post.api.models.protos";

// 来自 n0099/tbclient.protobuf 的 PbGoodsInfo 定义
message PbGoodsInfo {
  string goods_title = 1;
  string goods_image = 2;
  string goods_price = 3;
  string goods_url = 4;
  uint32 sort = 5;
  string goods_from = 6;
  string goods_url_h5 = 7;
  int64 goods_id = 8;
}
