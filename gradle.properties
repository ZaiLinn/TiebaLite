android.enableJetifier=true
android.injected.testOnly=false
android.useAndroidX=true
# Android 16 兼容: 16KB 页对齐 / 16KB page alignment for Android 16
android.experimental.enable16kbPageAlignment=true
kapt.verbose=true
kotlin.code.style=official
kotlin.parallel.tasks.in.project=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.caching=true
# configureondemand 与 AGP 8.7.3 + compileSdk 36 组合下触发
# "Cannot query the value of this provider" (compileDebugJavaWithJavac 依赖解析失败, 09-17 CI 根因之三)
#org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
# org.gradle.unsafe.configuration-cache=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
# 网络抖动兜底: gradle 对下载失败默认零重试, 一条连接被掐全盘崩 (09-16 CI 全红根因之一)
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
